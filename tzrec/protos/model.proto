syntax = "proto2";
package tzrec.protos;

import "tzrec/protos/models/rank_model.proto";
import "tzrec/protos/models/multi_task_rank.proto";
import "tzrec/protos/models/match_model.proto";
import "tzrec/protos/models/general_rank_model.proto";
import "tzrec/protos/loss.proto";
import "tzrec/protos/metric.proto";
import "tzrec/protos/seq_encoder.proto";
import "tzrec/protos/module.proto";

enum FeatureGroupType {
    DEEP = 0;
    WIDE = 1;
    SEQUENCE = 2;
    JAGGED_SEQUENCE = 3;
}

message SeqGroupConfig {
    optional string group_name = 1;
    repeated string feature_names = 2;
    // Suffix appended to each feature's embedding_name; same semantics as
    // FeatureGroupConfig.embedding_name_suffix. Empty == disabled.
    optional string embedding_name_suffix = 3;
}

message FeatureGroupConfig {
    required string group_name = 1;
    repeated string feature_names = 2;
    required FeatureGroupType group_type = 3 [default = DEEP];
    repeated SeqGroupConfig sequence_groups = 4;
    repeated SeqEncoderConfig sequence_encoders = 5;
    // Suffix appended to each feature's embedding_name so groups with
    // different suffixes use independent embedding tables. Empty == disabled.
    optional string embedding_name_suffix = 6;
}

enum Kernel {
    TRITON = 0;
    PYTORCH = 1;
    CUTLASS = 2;
}

message ModelConfig {

    repeated FeatureGroupConfig feature_groups = 1;

    oneof model {
	    DLRM dlrm = 100;
	    DeepFM deepfm = 101;
        MultiTower multi_tower = 102;
        MultiTowerDIN multi_tower_din = 103;
        MaskNet mask_net = 104;
        WideAndDeep wide_and_deep = 105;
        DCNV1 dcn_v1 = 106;
        DCNV2 dcn_v2 = 107;
        xDeepFM xdeepfm = 108;
        WuKong wukong = 109;

        SimpleMultiTask simple_multi_task = 200;
        MMoE mmoe = 201;
        DBMTL dbmtl = 202;
        PLE ple = 203;
        DC2VR dc2vr = 204;
        DlrmHSTU dlrm_hstu = 205;
        PEPNet pepnet = 206;
        UltraHSTU ultra_hstu = 207;
        PEPNet_v2 pepnet_v2 = 208;
        PEPNetDCNPLE pepnet_dcn_ple = 209;

        DSSM dssm = 301;
        DSSMV2 dssm_v2 = 302;
        DAT dat = 303;
        HSTUMatch hstu_match = 304;
        MIND mind = 305;

        TDM tdm = 400;

        RocketLaunching rocket_launching = 500;
    }

    optional uint32 num_class = 2 [default = 1];

    repeated LossConfig losses = 3;

    repeated MetricConfig metrics = 4;

    repeated TrainMetricConfig train_metrics = 5;

    optional VariationalDropout variational_dropout = 11;

    optional Kernel kernel = 12 [default = PYTORCH];

    // whether use pareto loss weight
    optional bool use_pareto_loss_weight = 13 [default = false];

    // whether use uncertainty weight for multi-task loss
    // (Kendall et al., "Multi-Task Learning Using Uncertainty to Weigh Losses", CVPR 2018)
    optional bool use_uncertainty_weight = 14 [default = false];

    // whether use PCGrad (gradient surgery) for multi-task learning
    // (Yu et al., "Gradient Surgery for Multi-Task Learning", NeurIPS 2020)
    optional bool use_pcgrad = 15 [default = false];

    // whether use CTCVR auxiliary loss (ESMM-style)
    // adds BCE(probs_ctr * probs_cvr, is_click & is_conversion) to total loss
    optional bool use_ctcvr_loss = 16 [default = false];

    // weight for the CTCVR auxiliary loss term
    optional float ctcvr_loss_weight = 17 [default = 1.0];

    // whether to isolate CVR gradient from flowing back to shared layers
    // when true, CVR tower's input is detached, preventing CVR gradients
    // from modifying shared/extraction network parameters
    optional bool isolate_cvr_gradient = 18 [default = false];

    // Whether to enable temperature calibration for task towers.
    optional bool use_calibration = 19 [default = false];
    // Calibration loss weight (combined with task losses during training).
    optional float calibration_loss_weight = 20 [default = 0.0];
    // Target ECE for the calibration loss.
    optional float calibration_target_ece = 21 [default = 0.05];

    // Progressive calibration: weight schedule (comma-separated pairs of
    // "warmup_steps:weight"). Example: "2000:0.0,4000:0.02,6000:0.05"
    // If empty, uses constant calibration_loss_weight.
    optional string progressive_calibration_schedule = 22 [default = ""];

    // Comma-separated list of tower names to calibrate. Empty = all tasks.
    // Example: "cvr" to calibrate only CVR tower.
    optional string calibration_tower_names = 23 [default = ""];

    // Inference-time Platt scaling (a*logit + b). Fitted offline after
    // training; applied as post-processing during inference.
    optional bool platt_calibration_enabled = 25 [default = false];

    // whether use strict PCGrad (true gradient projection) vs approximate
    // (loss-weighting modulation). Strict mode requires more GPU memory.
    optional bool use_pcgrad_strict = 24 [default = false];

}
