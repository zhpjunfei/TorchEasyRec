syntax = "proto2";
package tzrec.protos;

import "tzrec/protos/module.proto";
import "tzrec/protos/tower.proto";

message SimpleMultiTask {
    repeated TaskTower task_towers = 1;
}

message MMoE {
    // mmoe expert module definition
    required MLP expert_mlp = 1;
    // mmoe gate module definition
    optional MLP gate_mlp = 2;
    // number of mmoe experts
    required uint32 num_expert = 3 [default=3];
    // task tower
    repeated TaskTower task_towers = 4;
}

message DBMTL {
    // shared bottom MaskNet module
    optional MaskNetModule mask_net = 6;
    // shared bottom mlp layer
    optional MLP bottom_mlp = 1;
    // mmoe expert mlp layer definition
    optional MLP expert_mlp = 2;
    // mmoe gate module definition
    optional MLP gate_mlp = 3;
    // number of mmoe experts
    optional uint32 num_expert = 4 [default=3];
    // bayes task tower
    repeated BayesTaskTower task_towers = 5;
}

message DC2VR {
    // shared bottom mlp layer
    optional MLP bottom_mlp = 1;
    // mmoe expert mlp layer definition
    optional MLP expert_mlp = 2;
    // mmoe gate module definition
    optional MLP gate_mlp = 3;
    // number of mmoe experts
    optional uint32 num_expert = 4 [default=3];
    // task tower
    repeated InterventionTaskTower task_towers = 5;
}



message PLE {
    // extraction network
    repeated ExtractionNetwork extraction_networks = 1;
    // task tower
    repeated TaskTower task_towers = 2;
}


message DlrmHSTU {
    // hstu config
    required HSTU hstu = 1;
    // multi task tower config
    required FusionMTLTower fusion_mtl_tower = 2;
    // max sequence length
    required uint32 max_seq_len = 3;
    // item embedding mlp hidden dimension
    optional uint32 item_embedding_hidden_dim = 4 [default = 512];
    // enables loss averaging computation globally across all ranks (total rank)
    // instead of locally (local rank).
    optional bool enable_global_average_loss = 5 [default = true];
    // timestamp of sequence is ascending or descending
    optional bool sequence_timestamp_is_ascending = 6 [default = true];
    // concat all contextual features on channel dim as one token
    optional bool concat_contextual_features = 7 [default = false];
}

message UltraHSTU {
    // Mixture of Transducers: one HSTU per channel; per-candidate
    // outputs are concatenated on the embedding dim.  >= 2 entries
    // requires every entry to set a unique non-empty `name` plus the
    // matching `<name>` / `<name>_action` / `<name>_watchtime` /
    // `<name>_timestamp` feature_groups.  Candidate-side and
    // contextual groups are shared across all channels.
    repeated HSTU hstu = 1;
    // multi task tower config
    required FusionMTLTower fusion_mtl_tower = 2;
    // max sequence length
    required uint32 max_seq_len = 3;
    // item embedding mlp hidden dimension
    optional uint32 item_embedding_hidden_dim = 4 [default = 512];
    // enables loss averaging computation globally across all ranks (total rank)
    // instead of locally (local rank).
    optional bool enable_global_average_loss = 5 [default = true];
    // timestamp of sequence is ascending or descending
    optional bool sequence_timestamp_is_ascending = 6 [default = true];
    // concat all contextual features on channel dim as one token
    optional bool concat_contextual_features = 7 [default = false];
}

message PEPNet {
    // epnet hidden units
    optional uint32 epnet_hidden_unit = 1;
    // activation function for epnet
    optional float  epnet_gamma = 2 [default = 2.0];
    // ppnet hidden units
    repeated uint32 ppnet_hidden_units = 3;
    // activation function for ppnet
    optional string ppnet_activation = 4 [default = 'nn.ReLU'];
    // ratio of dropout
    repeated float ppnet_dropout_ratio = 5;
    optional float  ppnet_gamma = 6 [default = 2.0];
    // domain feature name, must is num bucket
    optional string domain_input_name = 7;
    // domain number for each task
    optional uint32 task_domain_num = 8 [default = 1];
    // task tower
    repeated TaskTower task_towers = 9;
}

message CDOTConfig {
    // feature dimension for each slot in CDOT
    optional uint32 input_dim = 1 [default = 16];
    // output dimension per slot after CDOT
    optional uint32 output_dim = 2 [default = 4];
    // mid dimension for sub_compress
    optional uint32 mid_dim = 3 [default = 32];
    // compress tower hidden units
    repeated uint32 compress_hidden_units = 4;
}

message PEPNet_v2 {
    // epnet hidden units
    optional uint32 epnet_hidden_unit = 1;
    // gamma for epnet gate
    optional float  epnet_gamma = 2 [default = 2.0];
    // epnet scale type: tanh (default) or sigmoid
    optional string epnet_scale_type = 3 [default = 'tanh'];

    // ppnet hidden units
    repeated uint32 ppnet_hidden_units = 4;
    // activation function for ppnet
    optional string ppnet_activation = 5 [default = 'nn.ReLU'];
    // ratio of dropout
    repeated float ppnet_dropout_ratio = 6;
    optional float  ppnet_gamma = 7 [default = 2.0];
    // ppnet scale type: tanh (default) or sigmoid
    optional string ppnet_scale_type = 8 [default = 'tanh'];

    // CDOT config
    optional CDOTConfig cdot = 9;
    // group name for CDOT features
    optional string cdot_group_name = 10 [default = 'all'];
    // group name for bias features
    optional string bias_group_name = 11 [default = 'all'];
    // group name for LHUC embedding (user_id + doc_id + req_page)
    optional string lhuc_group_name = 12 [default = 'domain'];
    // main group name
    optional string main_group_name = 13 [default = 'all'];

    // task tower
    repeated TaskTower task_towers = 14;
    // whether to add ctr logits to cvr
    optional bool cvr_add_ctr_logits = 15 [default = true];
}
